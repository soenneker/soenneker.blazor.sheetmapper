name: deploy-demo

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100
          workloads: wasm-tools

      - name: Restore demo
        run: dotnet restore test/Soenneker.Blazor.SheetMapper.Demo/Soenneker.Blazor.SheetMapper.Demo.csproj --verbosity minimal

      - name: Publish Blazor WebAssembly Demo
        run: dotnet publish test/Soenneker.Blazor.SheetMapper.Demo/Soenneker.Blazor.SheetMapper.Demo.csproj -c Release

      - name: Set Base Href for GitHub Pages
        run: |
          cd test/Soenneker.Blazor.SheetMapper.Demo/bin/Release/net11.0/publish/wwwroot
          sed -i 's|%BASE_URL%|/${{ github.event.repository.name }}/|g' index.html || exit 1

      - name: Add .nojekyll
        run: touch test/Soenneker.Blazor.SheetMapper.Demo/bin/Release/net11.0/publish/wwwroot/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: test/Soenneker.Blazor.SheetMapper.Demo/bin/Release/net11.0/publish/wwwroot

  deploy-demo:
    needs: build-demo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
